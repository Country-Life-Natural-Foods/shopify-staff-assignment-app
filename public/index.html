<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>B2B Map Sync Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f6faff; }
        .loading-overlay { display: none; }
        .loading-overlay.active { display: flex; }
        .toast { transform: translateY(100%); transition: transform 0.3s ease; }
        .toast.active { transform: translateY(0); }
        #map { width: 100%; height: 100%; min-height: 400px; border-radius: 0.5rem; }
    </style>
</head>
<body class="text-zinc-900 bg-[#f6faff]">

<!-- Top Navigation -->
<nav class="h-16 border-b border-zinc-200 bg-white flex items-center px-4 md:px-6 justify-between shadow-sm z-40 relative sticky top-0">
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-[#008060] flex items-center justify-center">
                <span class="material-symbols-outlined text-white text-sm">map</span>
            </div>
            <span class="font-bold text-lg hidden sm:block">B2B Map Sync</span>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button id="sync-btn" onclick="syncMap()" class="bg-[#008060] text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-[#00654b] active:scale-[0.98] transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">sync</span>
            Run Map Sync
        </button>
    </div>
</nav>

<!-- Error Toast -->
<div id="error-toast" class="toast fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 max-w-[90vw] md:max-w-md w-full">
    <span class="material-symbols-outlined">error</span>
    <p class="text-sm font-medium flex-1"></p>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay fixed inset-0 bg-white/80 backdrop-blur-sm z-50 items-center justify-center flex-col gap-4">
    <div class="w-12 h-12 border-4 border-[#008060]/20 border-t-[#008060] rounded-full animate-spin"></div>
    <p class="text-[#008060] font-medium animate-pulse">Loading B2B locations...</p>
</div>

<div class="flex h-[calc(100vh-64px)] overflow-hidden">
    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto w-full md:pb-0 pb-16">
        <div class="p-4 md:p-6 lg:p-8 max-w-[1600px] mx-auto space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- Stats Cards -->
                <div class="bg-white rounded-xl p-5 border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-zinc-500">Total B2B Locations</p>
                        <div class="p-2 bg-blue-50 rounded-lg"><span class="material-symbols-outlined text-blue-600 text-[20px]">pin_drop</span></div>
                    </div>
                    <h3 class="text-2xl font-bold text-zinc-900" id="locations-stat">-</h3>
                </div>
                <div class="bg-white rounded-xl p-5 border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-zinc-500">Synced to Map</p>
                        <div class="p-2 bg-green-50 rounded-lg"><span class="material-symbols-outlined text-green-600 text-[20px]">check_circle</span></div>
                    </div>
                    <h3 class="text-2xl font-bold text-zinc-900" id="synced-stat">-</h3>
                </div>
                <div class="bg-white rounded-xl p-5 border border-zinc-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-zinc-500">Missing Coordinates</p>
                        <div class="p-2 bg-red-50 rounded-lg"><span class="material-symbols-outlined text-red-600 text-[20px]">warning</span></div>
                    </div>
                    <h3 class="text-2xl font-bold text-zinc-900" id="missing-stat">-</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Locations List -->
                <div class="bg-white rounded-xl border border-zinc-200 shadow-sm overflow-hidden flex flex-col h-[600px]">
                    <div class="p-5 border-b border-zinc-100 flex-shrink-0">
                        <h2 class="text-lg font-bold">Location Directory</h2>
                        <div class="relative mt-3">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm">search</span>
                            <input id="location-search" type="text" placeholder="Search by name or city..." class="w-full pl-9 pr-4 py-2 bg-zinc-50 border border-zinc-200 rounded-md text-sm focus:ring-2 focus:ring-[#008060] focus:border-[#008060] outline-none transition-all" onkeyup="renderLocations()"/>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-2" id="locations-list">
                        <!-- Locations populated by JS -->
                    </div>
                </div>

                <!-- Map View -->
                <div class="lg:col-span-2 bg-white rounded-xl border border-zinc-200 shadow-sm overflow-hidden h-[600px] flex flex-col">
                    <div class="p-5 border-b border-zinc-100 flex-shrink-0 flex justify-between items-center">
                        <h2 class="text-lg font-bold">Geographic Distribution</h2>
                        <span class="text-sm text-zinc-500">Powered by Mapbox</span>
                    </div>
                    <div class="flex-1 p-0 relative">
                        <div id="map"></div>
                        <div id="map-placeholder" class="absolute inset-0 flex items-center justify-center bg-zinc-50 text-zinc-500 flex-col gap-2">
                            <span class="material-symbols-outlined text-4xl">map</span>
                            <p>Mapbox token required to view map.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>window.shopifyApiFetch = window.fetch.bind(window);</script>
<script type="module" src="/shopify-session-bootstrap.js"></script>
<script>
    let locations = [];
    let map;
    let markers = [];

    const MAPBOX_TOKEN = document.querySelector('meta[name="mapbox-token"]')?.getAttribute('content') || '';

    function apiUrl(path) {
        const params = new URLSearchParams(window.location.search);
        const shop = params.get('shop');
        const host = params.get('host');
        const q = new URLSearchParams();
        if (shop) q.set('shop', shop);
        if (host) q.set('host', host);
        const qs = q.toString();
        return qs ? `${path}?${qs}` : path;
    }

    function setLoading(active) {
        document.getElementById('loading-overlay').classList.toggle('active', active);
    }

    function showError(msg) {
        const toast = document.getElementById('error-toast');
        toast.querySelector('p').textContent = msg;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 5000);
    }

    async function loadData() {
        setLoading(true);
        try {
            const res = await window.shopifyApiFetch(apiUrl('/api/locations'));
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || 'Failed to load locations');

            locations = (data.edges || []).map(e => {
                const fields = {};
                e.node.fields.forEach(f => fields[f.key] = f.value);
                return {
                    id: e.node.id,
                    handle: e.node.handle,
                    ...fields
                };
            });

            renderSummary();
            renderLocations();
            initMap();
        } catch (e) {
            console.error(e);
            showError(e.message);
        } finally {
            setLoading(false);
        }
    }

    function renderSummary() {
        document.getElementById('locations-stat').textContent = locations.length.toLocaleString();

        const synced = locations.filter(l => l.latitude && l.longitude).length;
        document.getElementById('synced-stat').textContent = synced.toLocaleString();

        const missing = locations.length - synced;
        document.getElementById('missing-stat').textContent = missing.toLocaleString();
    }

    function renderLocations() {
        const search = document.getElementById('location-search').value.toLowerCase();
        const filtered = locations.filter(l =>
            (l.business_name || '').toLowerCase().includes(search) ||
            (l.city || '').toLowerCase().includes(search) ||
            (l.province_state || '').toLowerCase().includes(search) ||
            (l.country || '').toLowerCase().includes(search)
        );

        const list = document.getElementById('locations-list');

        list.innerHTML = filtered.map(l => {
            const hasCoords = l.latitude && l.longitude;
            return `
                <div class="p-3 hover:bg-zinc-50 rounded-lg cursor-pointer transition-colors border-b border-zinc-100 last:border-0" onclick="flyToLocation(${l.latitude || 0}, ${l.longitude || 0})">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-semibold text-sm text-zinc-900">${l.business_name || 'Unnamed Location'}</h4>
                            <p class="text-xs text-zinc-500 mt-1">${[l.address_line_1, l.city, l.province_state, l.country].filter(Boolean).join(', ')}</p>
                        </div>
                        <div class="flex items-center">
                            <span class="material-symbols-outlined text-[16px] ${hasCoords ? 'text-green-500' : 'text-red-400'}" title="${hasCoords ? 'Synced' : 'Missing Coords'}">
                                ${hasCoords ? 'location_on' : 'location_off'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }).join('') || '<div class="p-8 text-center text-zinc-500"><span class="material-symbols-outlined text-4xl mb-2">search_off</span><p>No locations found</p></div>';
    }

    function initMap() {
        if (!MAPBOX_TOKEN) return;

        document.getElementById('map-placeholder').style.display = 'none';

        try {
            mapboxgl.accessToken = MAPBOX_TOKEN;
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/light-v11',
                center: [-98.5795, 39.8283], // Center of US
                zoom: 3
            });

            map.addControl(new mapboxgl.NavigationControl());

            map.on('load', () => {
                updateMarkers();
            });
        } catch (e) {
            console.error('Mapbox init error:', e);
            document.getElementById('map-placeholder').style.display = 'flex';
        }
    }

    function updateMarkers() {
        if (!map) return;

        // Clear existing
        markers.forEach(m => m.remove());
        markers = [];

        const bounds = new mapboxgl.LngLatBounds();
        let hasValidCoords = false;

        locations.forEach(loc => {
            const lat = parseFloat(loc.latitude);
            const lng = parseFloat(loc.longitude);

            if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                hasValidCoords = true;

                // Create popup
                const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(
                    `<div class="p-2">
                        <h3 class="font-bold text-sm">${loc.business_name || 'B2B Location'}</h3>
                        <p class="text-xs text-gray-600">${loc.address_line_1 || ''}</p>
                        <p class="text-xs text-gray-600">${[loc.city, loc.province_state, loc.country].filter(Boolean).join(', ')}</p>
                    </div>`
                );

                // Create marker
                const el = document.createElement('div');
                el.className = 'w-6 h-6 bg-[#008060] rounded-full border-2 border-white shadow-md flex items-center justify-center cursor-pointer';
                el.innerHTML = '<span class="w-2 h-2 bg-white rounded-full"></span>';

                const marker = new mapboxgl.Marker(el)
                    .setLngLat([lng, lat])
                    .setPopup(popup)
                    .addTo(map);

                markers.push(marker);
                bounds.extend([lng, lat]);
            }
        });

        if (hasValidCoords && markers.length > 0) {
            map.fitBounds(bounds, { padding: 50, maxZoom: 10 });
        }
    }

    function flyToLocation(lat, lng) {
        if (!map || !lat || !lng) return;
        map.flyTo({
            center: [lng, lat],
            zoom: 12,
            essential: true
        });
    }

    async function syncMap() {
        const btn = document.getElementById('sync-btn');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> Syncing...';

        try {
            const res = await window.shopifyApiFetch(apiUrl('/api/sync-b2b-map'), { method: 'POST' });
            const raw = await res.text();
            let data = null;
            try {
                data = raw ? JSON.parse(raw) : null;
            } catch {
                if (res.status === 504) {
                    throw new Error('Sync timed out on the server. Re-run sync (it continues from cached coords) or raise function maxDuration.');
                }
                throw new Error((raw || `HTTP ${res.status}`).slice(0, 180));
            }
            if (!res.ok) throw new Error(data?.error || 'Sync failed');

            const incompleteNote = data.incomplete ? ' (partial — run again to continue)' : '';
            // Show success toast
            const toast = document.getElementById('error-toast');
            toast.className = 'toast fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 max-w-[90vw] md:max-w-md w-full active';
            toast.innerHTML = `<span class="material-symbols-outlined">check_circle</span><p class="text-sm font-medium flex-1">Sync Complete! Created: ${data.created}, Updated: ${data.updated}${incompleteNote}</p>`;
            setTimeout(() => {
                toast.classList.remove('active');
                setTimeout(() => {
                    // Reset to error style for next time
                    toast.className = 'toast fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 max-w-[90vw] md:max-w-md w-full';
                    toast.innerHTML = `<span class="material-symbols-outlined">error</span><p class="text-sm font-medium flex-1"></p>`;
                }, 300);
            }, 5000);

            // Reload data
            await loadData();
        } catch (e) {
            showError('Sync failed: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    }

    let started = false;
    function init() {
        if (started) return;
        started = true;
        loadData();
    }
    window.addEventListener('shopify:api-fetch-ready', init, { once: true });
    window.addEventListener('load', init, { once: true });
</script>
</body>
</html>
